name: amr-nav

services:
  amr:
    build:
      context: .
      dockerfile: Dockerfile
    image: amr-nav:jazzy
    container_name: amr
    network_mode: host      # DDS discovery + gz transport
    ipc: host               # FastDDS shared memory
    environment:
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      ROS_DOMAIN_ID: "42"
      RCUTILS_COLORIZED_OUTPUT: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/work            # Project-3
    working_dir: /work
    stdin_open: true
    tty: true
    command: bash
