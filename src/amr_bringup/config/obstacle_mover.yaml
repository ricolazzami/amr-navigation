obstacle_mover:
  ros__parameters:
    use_sim_time: true
    world_name: maze
    model_name: mover
    # slides *across* the robot's east corridor (the A* route leaves the start
    # room at y ~= -4.33 and runs east), so the reflex really has to hold, mark
    # and replan around it. It must cross the lane, never run along it: a mover
    # that sweeps parallel to the route at x=1.5 physically collides with the
    # robot at x=1.68 and can never be passed.
    # quoted: YAML 1.1 reads a bare `y` as boolean True
    axis: "y"
    x: 0.5
    z: 0.25
    # The robot drives the east leg at y ~= -4.33. The box must sweep *past*
    # that lane (down to -4.8), not stop short of it, or it only clips the
    # 0.18 m forward corridor for a fraction of a second and the reflex never
    # has to hold. A slow period keeps it in the corridor long enough for the
    # controller to arrive and pin.
    y_min: -4.8
    y_max: -3.4
    period: 9.0
    rate_hz: 5.0
    # The box yields only when it is both close in 2-D and actually in the
    # robot's corridor. With the radius alone it froze at the bottom of the
    # sweep, 0.6 m off the lane and outside the 0.18 m corridor, so the robot
    # sailed past an obstacle it could not see. Same 0.18 m as amr_control's
    # corridor_half_width, so both nodes agree on what "in the way" means.
    guard_radius: 0.75
    guard_lateral: 0.18
    # Where in the 9 s sweep the box sits when the first plan arrives. The robot
    # crosses x = 0.5 at 22.0-22.2 sim s after the plan (measured) and comes
    # inside the 0.75 m guard radius at ~19.4 s; the box crosses the lane
    # (y = -4.33, the y the A* route uses on the east leg) at 1.77 s and 7.23 s
    # into a sweep, so 0.7 s puts it 0.02 m off the lane at 19.4 s and within
    # 0.14 m of it across a +/-0.3 s spread. The freeze then lands squarely in
    # the 0.18 m corridor. Measured, not guessed: docs/metrics/README.md
    phase_offset: 0.7
